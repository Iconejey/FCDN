<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Appairage Montre Wear OS</title>
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" type="image/png" href="/assets/icon.png" />
		<link rel="stylesheet" href="/global.css" type="text/css" />
		<style>
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				padding: 1rem;
				font-family: 'Times New Roman', Times, serif;
			}

			.pairing-card {
				border: 2px solid black;
				padding: 2rem 1.5rem;
				max-width: 420px;
				width: 100%;
				text-align: center;

				& h2 {
					margin-bottom: 1rem;
				}

				& p {
					font-size: 1.1rem;
				}

				& .status {
					font-weight: bold;
					margin-top: 1.5rem;
					color: green;
				}

				& .error {
					font-weight: bold;
					margin-top: 1.5rem;
					color: red;
				}
			}
		</style>
	</head>
	<body>
		<div class="pairing-card">
			<h2>Appairage Montre</h2>
			<p id="msg_el">Association de la montre avec votre session...</p>
		</div>

		<script>
			const url_params = new URLSearchParams(window.location.search);
			const token = url_params.get('token');
			const user_id = localStorage.getItem('user_id');
			const msg_el = document.getElementById('msg_el');

			function pairWatch() {
				if (!token) {
					msg_el.textContent = 'Requête invalide : jeton manquant.';
					msg_el.className = 'error';
					return;
				}

				if (!user_id) {
					msg_el.textContent = "Aucun identifiant utilisateur trouvé dans le navigateur. Veuillez d'abord vous connecter à l'application web.";
					msg_el.className = 'error';
					return;
				}

				fetch('/api/pair', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ token, user_id })
				})
					.then(r => r.json())
					.then(res_data => {
						if (res_data.success) {
							msg_el.textContent = 'Montre appairée avec succès !';
							msg_el.className = 'status';
						} else {
							msg_el.textContent = "Échec de l'appairage.";
							msg_el.className = 'error';
						}
					})
					.catch(() => {
						msg_el.textContent = "Erreur réseau lors de l'appairage.";
						msg_el.className = 'error';
					});
			}

			pairWatch();
		</script>
	</body>
</html>
